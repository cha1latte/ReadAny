name: Release ReadAny Shlai

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Official ReadAny version
        required: true
        type: string
        default: "1.3.5"
      revision:
        description: Shlai revision
        required: true
        type: string
        default: "1"
      version_code:
        description: Android version code
        required: true
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: shlai-stable-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04
    steps:
      - name: Validate release request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Stable releases must be dispatched from refs/heads/main; got $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$INPUT_UPSTREAM_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid canonical upstream version: $INPUT_UPSTREAM_VERSION" >&2
            exit 1
          fi
          if [[ ! "$INPUT_REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid positive Shlai revision: $INPUT_REVISION" >&2
            exit 1
          fi
          if (( ${#INPUT_REVISION} > 16 )) || { (( ${#INPUT_REVISION} == 16 )) && [[ "$INPUT_REVISION" > "9007199254740991" ]]; }; then
            echo "Shlai revision exceeds JavaScript's maximum safe integer." >&2
            exit 1
          fi
          if [[ ! "$INPUT_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid positive Android version code: $INPUT_VERSION_CODE" >&2
            exit 1
          fi
          if (( ${#INPUT_VERSION_CODE} > 10 )) || { (( ${#INPUT_VERSION_CODE} == 10 )) && [[ "$INPUT_VERSION_CODE" > "2100000000" ]]; }; then
            echo "Android version code exceeds 2100000000." >&2
            exit 1
          fi

          decimal_gt() {
            local left="$1"
            local right="$2"
            if (( ${#left} != ${#right} )); then
              (( ${#left} > ${#right} ))
              return
            fi
            [[ "$left" > "$right" ]]
          }

          tuple_gt() {
            local -a left=("$1" "$2" "$3" "$4")
            local -a right=("$5" "$6" "$7" "$8")
            local index
            for index in 0 1 2 3; do
              if [[ "${left[$index]}" == "${right[$index]}" ]]; then
                continue
              fi
              decimal_gt "${left[$index]}" "${right[$index]}"
              return
            done
            return 1
          }

          RELEASES_JSON="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp)"
          RELEASE_ROWS="$(printf '%s' "$RELEASES_JSON" | jq -r '.[][] | select(.draft == false and .prerelease == false) | @base64')"
          PRIOR_TAG=""
          PRIOR_BODY=""
          PRIOR_MAJOR=""
          PRIOR_MINOR=""
          PRIOR_PATCH=""
          PRIOR_REVISION=""
          while IFS= read -r encoded_release; do
            [[ -z "$encoded_release" ]] && continue
            release_json="$(printf '%s' "$encoded_release" | base64 --decode)"
            release_tag="$(printf '%s' "$release_json" | jq -r '.tag_name')"
            if [[ ! "$release_tag" =~ ^shlai-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.([1-9][0-9]*)$ ]]; then
              continue
            fi
            candidate_major="${BASH_REMATCH[1]}"
            candidate_minor="${BASH_REMATCH[2]}"
            candidate_patch="${BASH_REMATCH[3]}"
            candidate_revision="${BASH_REMATCH[4]}"
            if [[ -z "$PRIOR_TAG" ]] || tuple_gt \
              "$candidate_major" "$candidate_minor" "$candidate_patch" "$candidate_revision" \
              "$PRIOR_MAJOR" "$PRIOR_MINOR" "$PRIOR_PATCH" "$PRIOR_REVISION"; then
              PRIOR_TAG="$release_tag"
              PRIOR_BODY="$(printf '%s' "$release_json" | jq -r '.body // ""')"
              PRIOR_MAJOR="$candidate_major"
              PRIOR_MINOR="$candidate_minor"
              PRIOR_PATCH="$candidate_patch"
              PRIOR_REVISION="$candidate_revision"
            fi
          done <<< "$RELEASE_ROWS"

          IFS=. read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$INPUT_UPSTREAM_VERSION"
          if [[ -z "$PRIOR_TAG" ]]; then
            echo "No prior stable Shlai release found; accepting first bounded positive release metadata."
          else
            if ! tuple_gt \
              "$NEW_MAJOR" "$NEW_MINOR" "$NEW_PATCH" "$INPUT_REVISION" \
              "$PRIOR_MAJOR" "$PRIOR_MINOR" "$PRIOR_PATCH" "$PRIOR_REVISION"; then
              echo "Requested Shlai semantic tuple must be newer than prior stable release $PRIOR_TAG." >&2
              exit 1
            fi

            mapfile -t PRIOR_VERSION_CODE_LINES < <(printf '%s\n' "$PRIOR_BODY" | sed 's/\r$//' | grep '^Android versionCode:' || true)
            if (( ${#PRIOR_VERSION_CODE_LINES[@]} != 1 )); then
              echo "Prior stable release $PRIOR_TAG lacks exactly one canonical Android versionCode metadata line." >&2
              exit 1
            fi
            if [[ "${PRIOR_VERSION_CODE_LINES[0]}" =~ ^Android\ versionCode:\ ([1-9][0-9]*)$ ]]; then
              PRIOR_VERSION_CODE="${BASH_REMATCH[1]}"
            else
              echo "Prior stable release $PRIOR_TAG has invalid Android versionCode metadata." >&2
              exit 1
            fi
            if (( ${#PRIOR_VERSION_CODE} > 10 )) || { (( ${#PRIOR_VERSION_CODE} == 10 )) && [[ "$PRIOR_VERSION_CODE" > "2100000000" ]]; }; then
              echo "Prior stable release $PRIOR_TAG has an invalid Android versionCode." >&2
              exit 1
            fi
            if ! decimal_gt "$INPUT_VERSION_CODE" "$PRIOR_VERSION_CODE"; then
              echo "Requested Android versionCode must exceed prior Android versionCode $PRIOR_VERSION_CODE." >&2
              exit 1
            fi
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @readany/core test
      - run: pnpm --filter @readany/app-expo test
      - run: pnpm exec tsc --noEmit -p packages/app-expo/tsconfig.json
      - name: Check changed files with Biome
        shell: bash
        run: |
          BASE_SHA="$(git rev-parse HEAD^)"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css')
          if (( ${#FILES[@]} > 0 )); then
            pnpm exec biome check --no-errors-on-unmatched "${FILES[@]}"
          fi
          git diff --check "$BASE_SHA" HEAD

  build:
    name: Build unsigned production APK
    needs: validate
    runs-on: ubuntu-22.04
    env:
      APP_VARIANT: production
      SHLAI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      SHLAI_REVISION: ${{ inputs.revision }}
      SHLAI_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.18.0
          cache: pnpm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android build tools 36.0.0
        run: sdkmanager "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @readany/app-expo run build:reader
      - run: pnpm --filter @readany/app-expo exec expo prebuild --platform android --clean --no-install
      - name: Build verified unsigned release APK
        shell: bash
        run: |
          set -euo pipefail

          node packages/app-expo/scripts/remove-release-debug-signing.js packages/app-expo/android/app/build.gradle
          cd packages/app-expo/android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          cd ../../..

          UNSIGNED_APK="packages/app-expo/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED_APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          if "$BUILD_TOOLS/apksigner" verify "$UNSIGNED_APK" >/dev/null 2>&1; then
            echo "Expected an unsigned release APK, but signature verification succeeded." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readany-shlai-unsigned-${{ github.sha }}
          path: packages/app-expo/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and publish ReadAny Shlai
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    environment: shlai-production
    steps:
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android build tools 36.0.0
        run: sdkmanager "build-tools;36.0.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: readany-shlai-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned
      - name: Sign, verify, and publish APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHLAI_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          SHLAI_REVISION: ${{ inputs.revision }}
          SHLAI_VERSION_CODE: ${{ inputs.version_code }}
          SHLAI_ANDROID_CERT_SHA256: ${{ vars.SHLAI_ANDROID_CERT_SHA256 }}
          SHLAI_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHLAI_ANDROID_KEYSTORE_BASE64 }}
          SHLAI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SHLAI_ANDROID_KEYSTORE_PASSWORD }}
          SHLAI_ANDROID_KEY_ALIAS: ${{ secrets.SHLAI_ANDROID_KEY_ALIAS }}
          SHLAI_ANDROID_KEY_PASSWORD: ${{ secrets.SHLAI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          TAG="shlai-v${SHLAI_UPSTREAM_VERSION}.${SHLAI_REVISION}"
          UNSIGNED_APK="$RUNNER_TEMP/unsigned/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/ReadAny-Shlai-aligned.apk"
          APK="ReadAny-Shlai.apk"
          KEYSTORE="$RUNNER_TEMP/readany-shlai-release.jks"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          trap 'rm -f "$KEYSTORE"' EXIT

          test "$GITHUB_REF" = "refs/heads/main"
          test -f "$UNSIGNED_APK"
          EXPECTED_CERT_SHA256="$(printf '%s' "$SHLAI_ANDROID_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$EXPECTED_CERT_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
            echo "SHLAI_ANDROID_CERT_SHA256 must normalize to exactly 64 hexadecimal characters." >&2
            exit 1
          fi
          EXACT_TAG_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq "[.[] | select(.ref == \"refs/tags/$TAG\")] | length")"
          if [[ "$EXACT_TAG_COUNT" != "0" ]]; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

          printf '%s' "$SHLAI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          if "$ZIPALIGN" -c -P 16 -v 4 "$UNSIGNED_APK" >/dev/null; then
            cp "$UNSIGNED_APK" "$ALIGNED_APK"
          else
            "$ZIPALIGN" -P 16 -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          fi
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$SHLAI_ANDROID_KEY_ALIAS" \
            --ks-pass env:SHLAI_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:SHLAI_ANDROID_KEY_PASSWORD \
            --out "$APK" \
            "$ALIGNED_APK"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          mapfile -t ACTUAL_CERT_DIGESTS < <(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')
          if (( ${#ACTUAL_CERT_DIGESTS[@]} != 1 )); then
            echo "Expected exactly one APK signer certificate SHA-256 digest." >&2
            exit 1
          fi
          ACTUAL_CERT_SHA256="$(printf '%s' "${ACTUAL_CERT_DIGESTS[0]}" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$ACTUAL_CERT_SHA256" =~ ^[0-9A-F]{64}$ || "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "Signed APK certificate SHA-256 digest does not match SHLAI_ANDROID_CERT_SHA256." >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          RELEASE_NOTES="$(printf 'Unofficial ReadAny Shlai Android release. Source: %s/%s/tree/%s\n\nAndroid versionCode: %s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$SHLAI_VERSION_CODE")"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ReadAny Shlai ${SHLAI_UPSTREAM_VERSION}.${SHLAI_REVISION}" \
            --notes "$RELEASE_NOTES"
