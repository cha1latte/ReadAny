<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <style>
      :root {
        --background: #111111;
        --foreground: #f5f5f5;
        --card: #1a1a1a;
        --border: #2a2a2a;
        --muted: #252525;
        --muted-foreground: #a1a1aa;
        --primary: #f97316;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      }

      body {
        padding: 14px 14px 18px;
      }

      #editor {
        min-height: 220px;
      }

      .readany-prosemirror {
        min-height: 220px;
        outline: none;
        font-size: 15px;
        line-height: 1.68;
        color: var(--foreground);
        caret-color: var(--primary);
        word-break: break-word;
      }

      .readany-prosemirror > *:first-child {
        margin-top: 0;
      }

      .readany-prosemirror > *:last-child {
        margin-bottom: 0;
      }

      .readany-prosemirror p {
        margin: 0.58em 0;
      }

      .readany-prosemirror h1,
      .readany-prosemirror h2,
      .readany-prosemirror h3 {
        margin: 1.15em 0 0.45em;
        line-height: 1.24;
        font-weight: 700;
        letter-spacing: 0;
      }

      .readany-prosemirror h1 {
        font-size: 23px;
      }

      .readany-prosemirror h2 {
        font-size: 19px;
      }

      .readany-prosemirror h3 {
        font-size: 16px;
      }

      .readany-prosemirror ul,
      .readany-prosemirror ol {
        margin: 0.6em 0;
        padding-left: 1.45em;
      }

      .readany-prosemirror li {
        margin: 0.2em 0;
        padding-left: 0.1em;
      }

      .readany-prosemirror ul[data-type="taskList"] {
        list-style: none;
        padding-left: 0;
      }

      .readany-prosemirror li[data-type="taskItem"] {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding-left: 0;
      }

      .readany-prosemirror li[data-type="taskItem"] > label {
        flex: 0 0 auto;
        margin-top: 0.34em;
      }

      .readany-prosemirror li[data-type="taskItem"] input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
      }

      .readany-prosemirror li[data-type="taskItem"] > div {
        min-width: 0;
        flex: 1;
      }

      .readany-prosemirror li[data-type="taskItem"] > div > p {
        margin-top: 0;
      }

      .readany-prosemirror blockquote {
        margin: 0.85em 0;
        padding: 0.58em 0.82em;
        border-left: 3px solid var(--primary);
        border-radius: 0 8px 8px 0;
        background: var(--muted);
        color: var(--muted-foreground);
      }

      .readany-prosemirror code {
        border-radius: 5px;
        background: var(--muted);
        padding: 0.12em 0.34em;
        font-family: "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.88em;
      }

      .readany-prosemirror pre {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--muted);
        padding: 10px;
      }

      .readany-prosemirror pre code {
        background: transparent;
        padding: 0;
      }

      .readany-prosemirror hr {
        height: 1px;
        margin: 1em 0;
        border: 0;
        background: var(--border);
      }

      .readany-prosemirror a {
        color: var(--primary);
        text-decoration: none;
      }

      .readany-prosemirror p.is-editor-empty:first-child::before {
        float: left;
        height: 0;
        color: var(--muted-foreground);
        content: attr(data-placeholder);
        pointer-events: none;
      }

      .readany-card {
        display: flex;
        gap: 10px;
        margin: 12px 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        padding: 11px;
      }

      .readany-card-icon {
        display: flex;
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: var(--muted);
        color: var(--primary);
        font-size: 16px;
        line-height: 1;
      }

      .readany-card-body {
        min-width: 0;
        flex: 1;
      }

      .readany-card-title {
        display: block;
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--foreground);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.35;
      }

      .readany-card-title::placeholder {
        color: var(--muted-foreground);
      }

      .readany-card-meta {
        margin-bottom: 3px;
        color: var(--muted-foreground);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .readany-card-preview {
        display: block;
        width: 100%;
        min-height: 74px;
        margin-top: 5px;
        resize: vertical;
        border: 1px solid transparent;
        border-radius: 8px;
        outline: 0;
        background: var(--muted);
        padding: 8px 9px;
        color: var(--muted-foreground);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .readany-card-preview:focus {
        border-color: var(--primary);
        background: var(--background);
        color: var(--foreground);
      }

      .readany-card-preview::placeholder {
        color: var(--muted-foreground);
      }

      .readany-card-source {
        margin-top: 7px;
        color: var(--muted-foreground);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <main id="editor"></main>
    <!-- __READANY_KNOWLEDGE_EDITOR_BUNDLE_INSERT_POINT_9d5b2a7c__ -->
  </body>
</html>
