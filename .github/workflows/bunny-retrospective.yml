name: Bunny Retrospective
run-name: Bunny retrospective - ${{ inputs.scope }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: One focused current-main audit (start with update-release).
        type: choice
        options:
          - update-release
          - update-discovery
          - update-install
          - annotations
          - reading-state
        default: update-release
        required: true

permissions:
  contents: read

concurrency:
  group: bunny-retrospective
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install trusted review dependencies
        run: python -I -m pip install -r .github/bunny-review/requirements.txt
      - name: Audit pinned main snapshot
        env:
          AUDIT_SCOPE: ${{ inputs.scope }}
          LLM_API_KEY: ${{ secrets.SHLAI_BUNNY_LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ vars.SHLAI_BUNNY_LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.SHLAI_BUNNY_LLM_MODEL || 'gpt-5.5' }}
        run: python -I .github/bunny-review/retrospective.py --scope "$AUDIT_SCOPE" --output "$RUNNER_TEMP/bunny-audit"
      - name: Upload audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bunny-retrospective-${{ inputs.scope }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bunny-audit/
          retention-days: 30
          if-no-files-found: warn
